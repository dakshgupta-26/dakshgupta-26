<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="proj-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="proj-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="proj-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes borderPulse {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.85; }
    }
    .main-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .code-font { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .card-border { animation: borderPulse 4s ease-in-out infinite; }
    .btn-hover:hover { opacity: 0.85; filter: brightness(1.2); }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="366" rx="14" fill="url(#proj-bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <path d="M 2 14 A 12 12 0 0 1 14 2 L 836 2 A 12 12 0 0 1 848 14 L 848 36 L 2 36 Z" fill="#0f172a" fill-opacity="0.8"/>
  <line x1="2" y1="36" x2="848" y2="36" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Control Buttons & Title -->
  <circle cx="20" cy="19" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="4.5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="4.5" fill="#10b981"/>

  <text x="72" y="23" fill="#94a3b8" class="code-font" font-size="11" font-weight="600">dakshgupta.projects // featured-engineering-work</text>

  <!-- Project 1: FitTrack AI (Left Card) -->
  <g transform="translate(20, 52)">
    <rect width="395" height="295" rx="10" fill="url(#proj-card-grad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" class="card-border"/>

    <!-- Category Tag -->
    <rect x="16" y="16" width="135" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="24" y="30" fill="#38bdf8" class="code-font" font-size="9.5" font-weight="700">🚀 FULL-STACK &amp; AI</text>

    <!-- Title (Clickable) -->
    <a href="https://fit-track-neon-xi.vercel.app/" target="_blank">
      <text x="16" y="65" fill="#38bdf8" class="main-font" font-size="22" font-weight="800" filter="url(#proj-glow)" style="cursor: pointer;">🏋️ FitTrack AI</text>
    </a>

    <!-- Description -->
    <text x="16" y="88" fill="#cbd5e1" class="main-font" font-size="11.5">
      <tspan x="16" dy="0">AI-powered wellness platform designed for personalized</tspan>
      <tspan x="16" dy="17">health telemetry tracking &amp; automated workout plans.</tspan>
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(16, 126)">
      <rect x="0" y="0" width="52" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="7" y="12" fill="#38bdf8" class="code-font" font-size="9">React</text>

      <rect x="58" y="0" width="60" height="18" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="0.8"/>
      <text x="65" y="12" fill="#818cf8" class="code-font" font-size="9">Node.js</text>

      <rect x="124" y="0" width="68" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
      <text x="131" y="12" fill="#34d399" class="code-font" font-size="9">MongoDB</text>

      <rect x="198" y="0" width="60" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="205" y="12" fill="#38bdf8" class="code-font" font-size="9">Tailwind</text>

      <rect x="264" y="0" width="36" height="18" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="0.8"/>
      <text x="271" y="12" fill="#c084fc" class="code-font" font-size="9">AI</text>
    </g>

    <!-- Bullet Features -->
    <g transform="translate(16, 166)" fill="#e2e8f0" class="main-font" font-size="11">
      <text x="0" y="0">⚡ Personalized workout &amp; diet AI recommendation engine</text>
      <text x="0" y="20">📈 Interactive telemetry analytics &amp; progress tracking</text>
      <text x="0" y="40">👥 Real-time community feeds &amp; activity telemetry</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(16, 240)">
      <!-- Source Code Button -->
      <a href="https://github.com/dakshgupta-26/FIT-TRACK" target="_blank" class="btn-hover">
        <rect x="0" y="0" width="120" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="16" y="19" fill="#38bdf8" class="code-font" font-size="10.5" font-weight="700">📂 Source Code</text>
      </a>

      <!-- Live Demo Button -->
      <a href="https://fit-track-neon-xi.vercel.app/" target="_blank" class="btn-hover">
        <rect x="132" y="0" width="115" height="30" rx="6" fill="url(#cyan-accent)"/>
        <text x="148" y="19" fill="#090d16" class="code-font" font-size="10.5" font-weight="800">🌐 Live Demo</text>
      </a>
    </g>
  </g>

  <!-- Project 2: SprintForge (Right Card) -->
  <g transform="translate(435, 52)">
    <rect width="395" height="295" rx="10" fill="url(#proj-card-grad)" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.2" class="card-border"/>

    <!-- Category Tag -->
    <rect x="16" y="16" width="145" height="20" rx="4" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
    <text x="24" y="30" fill="#c084fc" class="code-font" font-size="9.5" font-weight="700">⚡ AGILE &amp; DEV TOOLS</text>

    <!-- Title (Clickable) -->
    <a href="https://fit-track-neon-xi.vercel.app/" target="_blank">
      <text x="16" y="65" fill="#c084fc" class="main-font" font-size="22" font-weight="800" filter="url(#proj-glow)" style="cursor: pointer;">🏃 SprintForge</text>
    </a>

    <!-- Description -->
    <text x="16" y="88" fill="#cbd5e1" class="main-font" font-size="11.5">
      <tspan x="16" dy="0">Agile project management and sprint acceleration platform</tspan>
      <tspan x="16" dy="17">built to streamline team velocity and developer workflows.</tspan>
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(16, 126)">
      <rect x="0" y="0" width="75" height="18" rx="4" fill="#0f172a" stroke="#3178c6" stroke-width="0.8"/>
      <text x="7" y="12" fill="#38bdf8" class="code-font" font-size="9">TypeScript</text>

      <rect x="81" y="0" width="52" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="88" y="12" fill="#38bdf8" class="code-font" font-size="9">React</text>

      <rect x="139" y="0" width="60" height="18" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="0.8"/>
      <text x="146" y="12" fill="#818cf8" class="code-font" font-size="9">Node.js</text>

      <rect x="205" y="0" width="76" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="212" y="12" fill="#34d399" class="code-font" font-size="9">PostgreSQL</text>
    </g>

    <!-- Bullet Features -->
    <g transform="translate(16, 166)" fill="#e2e8f0" class="main-font" font-size="11">
      <text x="0" y="0">⚡ Interactive Kanban &amp; Sprint planning boards</text>
      <text x="0" y="20">📊 Agile velocity metrics &amp; burndown analytics</text>
      <text x="0" y="40">🛡️ Role-based access control &amp; task automation</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(16, 240)">
      <!-- Source Code Button -->
      <a href="https://github.com/dakshgupta-26/SprintForge" target="_blank" class="btn-hover">
        <rect x="0" y="0" width="120" height="30" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
        <text x="16" y="19" fill="#c084fc" class="code-font" font-size="10.5" font-weight="700">📂 Source Code</text>
      </a>

      <!-- Live Demo Button -->
      <a href="https://fit-track-neon-xi.vercel.app/" target="_blank" class="btn-hover">
        <rect x="132" y="0" width="115" height="30" rx="6" fill="url(#purple-accent)"/>
        <text x="148" y="19" fill="#090d16" class="code-font" font-size="10.5" font-weight="800">🌐 Live Demo</text>
      </a>
    </g>
  </g>
</svg>
